{{- if le (int .Values.terminationGracePeriodSeconds) (int .Values.preStopSleepSeconds) }}
{{- fail "terminationGracePeriodSeconds must exceed preStopSleepSeconds, or the pod is killed before uvicorn gets SIGTERM" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "microfvs.name" . }}
  labels:
    {{- include "microfvs.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.rollingUpdate.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "microfvs.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "microfvs.labels" . | nindent 8 }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.topologySpread.enabled }}
      # matchLabelKeys scopes each constraint to one ReplicaSet, so a rollout's surge pod is
      # not forced off every node that still runs an old pod.
      topologySpreadConstraints:
        # Hard: two replicas on one node is how a single drain takes the service down. On EKS
        # Auto Mode an unsatisfiable placement makes Karpenter add a node rather than leave
        # the pod pending, and the PodDisruptionBudget keeps the other replica serving while
        # it does.
        - topologyKey: kubernetes.io/hostname
          maxSkew: 1
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "microfvs.selectorLabels" . | nindent 14 }}
          matchLabelKeys:
            - pod-template-hash
        # Soft: zone spread is preferred, but a zone short of capacity must not block a
        # replacement pod — that would turn a capacity blip into lost redundancy.
        - topologyKey: topology.kubernetes.io/zone
          maxSkew: 1
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "microfvs.selectorLabels" . | nindent 14 }}
          matchLabelKeys:
            - pod-template-hash
      {{- end }}
      containers:
        - name: {{ include "microfvs.name" . }}
          image: "{{ required "image.repository is supplied by CI" .Values.image.repository }}:{{ required "image.tag is supplied by CI" .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          # Keeps serving while the ALB deregisters the target; see the shutdown notes in
          # values.yaml. The native sleep action needs no `sleep` binary in the image.
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.preStopSleepSeconds }}
          # The app runs with --root-path so it is aware of its public prefix, but routes
          # still mount at the root — probes hit the clean path.
          startupProbe:
            httpGet:
              path: {{ .Values.healthcheckPath }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.healthcheckPath }}
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.healthcheckPath }}
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
