# Defaults describe the application itself — ports, probes, resources — and are the same
# wherever it runs.
#
# Deployment-specific values (image registry, hostname, ingress class) are supplied by CI
# and left empty here. The templates mark them required, so a missing one fails the render
# instead of producing a placeholder.
#
# Per-stage overrides live in values-<stage>.yaml next to this file; CI layers the file for
# the stage it is rendering on top of these defaults.

image:
  # Both set at publish time: the registry is resolved then, the tag is the release tag.
  repository: ""
  tag: ""

# Two replicas, so a node drain or a rollout always leaves one serving. At 1 the chart still
# renders, but without a PodDisruptionBudget (one with a single pod would block every drain)
# and a drain or node failure is an outage.
replicaCount: 2

nameOverride: microfvs

serviceAccount:
  # Created, but intentionally granted nothing: MicroFVS reads no cloud resources at runtime.
  create: true
  name: microfvs

containerPort: 8080
healthcheckPath: /healthcheck

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 2Gi

# Rollouts add a new pod before removing an old one, so capacity never drops.
rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0
# A new pod counts as available only after it has been Ready this long, so a rollout does not
# remove an old pod before the ALB has health-checked the new one into service (by default
# 2 checks, 15 s apart).
minReadySeconds: 30

# Replicas go on different nodes (hard) and, where there is capacity, different zones (soft).
# See templates/deployment.yaml for why each is hard or soft.
topologySpread:
  enabled: true

# A /run is CPU-bound and can last minutes to hours.
#
# Liveness is slack on purpose: a long run can starve the event loop, and a tight probe would
# restart the pod mid-run.
#
# Shutdown, in order:
#   1. The pod is marked terminating and leaves the Service endpoints; the load balancer
#      controller deregisters its target and the ALB stops sending it new requests.
#   2. preStopSleepSeconds: the app keeps serving while step 1 propagates, so nothing is
#      routed to a pod that has stopped listening.
#   3. SIGTERM: uvicorn stops accepting connections and finishes the requests in flight.
#   4. terminationGracePeriodSeconds after step 1, anything still running is killed. A run
#      longer than this still loses its request, which was equally true on ECS.
preStopSleepSeconds: 20
terminationGracePeriodSeconds: 300
probes:
  startup:
    periodSeconds: 5
    failureThreshold: 24
  readiness:
    periodSeconds: 10
    timeoutSeconds: 3
  liveness:
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6

ingress:
  enabled: true
  # Both supplied by CI — see the note at the top of this file.
  className: ""
  host: ""
  # Set only if the platform wants this service reachable under a second name.
  extraHosts: []
  # How long the ALB lets requests already in flight to a deregistering target finish (the
  # AWS default is 300 s). It must be at least preStopSleepSeconds — the template enforces
  # this — and is set a little above it so a request that starts just before deregistration
  # can run to the 30 s API Gateway integration timeout.
  deregistrationDelaySeconds: 30
