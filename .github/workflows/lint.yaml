name: Lint

on: 
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Lint and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --frozen --extra dev

      - uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-

      # Runs all hooks in .pre-commit-config.yaml (gitleaks, ruff, mypy).
      - uses: pre-commit/action@v3.0.1

  chart:
    name: Lint and render the Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      # Placeholders for the values CI supplies at publish time; the chart marks them required.
      - name: Lint and render each stage
        run: |
          set -euo pipefail
          for values in chart/values-*.yaml; do
            echo "::group::${values}"
            args=(
              --values "${values}"
              --set image.repository=registry.example/microfvs
              --set image.tag=ci
              --set ingress.host=microfvs.example
              --set ingress.className=alb
            )
            helm lint --strict ./chart "${args[@]}"
            helm template microfvs ./chart --namespace microfvs "${args[@]}" > /dev/null
            echo "::endgroup::"
          done

  pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          validateSingleCommit: false