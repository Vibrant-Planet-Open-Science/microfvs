name: Release

# Release Please drives versioning from Conventional Commit messages. On every push to
# main it maintains a "Release PR" accumulating the changelog and the next semver bump.
#
#   merge to main      test, build, push, deploy DEV at sha-<short>
#   merge the Release  the above at the release tag, then deploy PROD, which waits on
#   PR                 the `prod` Environment's reviewers
#
# Nothing runs on pull_request, so a fork PR cannot reach the OIDC role. Prod deploys
# live in this workflow rather than a `release: published` one because release-please
# creates the release with GITHUB_TOKEN, and events from GITHUB_TOKEN do not trigger
# workflows.
#
# The AWS role ARN (which embeds the account id) is NOT stored in this public
# repo — it is read from the AWS_ECR_PUSH_ROLE_ARN Actions secret. The ECR
# registry host is discovered at runtime from amazon-ecr-login.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FVS_TAG: FS2026.2
  AWS_REGION: us-west-2
  ECR_REPOSITORY: vibrant-planet/microfvs
  GHCR_IMAGE: ghcr.io/vibrant-planet-open-science/microfvs
  LOCAL_IMAGE: microfvs:publish

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release + tag, commit the Release PR
      pull-requests: write    # open/update the Release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  test:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: dev
          tags: microfvs-ci:dev
          load: true
          build-args: FVS_TAG=${{ env.FVS_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests inside dev image
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspaces/microfvs" \
            -w /workspaces/microfvs \
            -e PYTHONPATH=/workspaces/microfvs \
            microfvs-ci:dev \
            bash -c 'uv sync --frozen --extra dev && uv run pytest .'

  publish:
    needs: [release-please, test]
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.push.outputs.image_tag }}
    permissions:
      id-token: write   # OIDC token for AWS AssumeRole
      contents: read
      packages: write   # push to GHCR
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      # Build the deployable image once (linux/amd64 for ECS Fargate) and load
      # it locally so we can smoke-test the exact artifact we push.
      #
      # fvs-python-base is exempted from the layer cache: its `apt-get upgrade`
      # keys on the (pinned) base digest plus the command string, so a cache hit
      # would republish whatever package set was current when the layer was first
      # built. Newly published Ubuntu security updates would be silently skipped.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: microfvs
          platforms: linux/amd64
          tags: ${{ env.LOCAL_IMAGE }}
          load: true
          build-args: FVS_TAG=${{ env.FVS_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache-filters: fvs-python-base

      - name: Smoke test runtime image
        run: |
          set -euo pipefail
          docker run -d --rm -p 8080:8080 --name microfvs-smoke "${LOCAL_IMAGE}"
          ok=
          for _ in $(seq 30); do
            if curl -fsS http://localhost:8080/healthcheck >/dev/null; then
              ok=1; break
            fi
            sleep 2
          done
          docker logs microfvs-smoke || true
          docker rm -f microfvs-smoke >/dev/null 2>&1 || true
          if [ -z "${ok}" ]; then
            echo "healthcheck did not become ready" >&2
            exit 1
          fi
          echo "healthcheck ok"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push to ECR and GHCR
        id: push
        env:
          ECR_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          VERSION_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=7 HEAD)"
          for repo in "${ECR_IMAGE}" "${GHCR_IMAGE}"; do
            # VERSION_TAG is empty unless this push merged the Release PR.
            tags="sha-${short_sha} ${VERSION_TAG}"
            # Nothing in the pipeline reads `latest` — Argo CD deploys a pinned tag. It is
            # kept only for people pulling the public GHCR image by hand, and only ever
            # points at a release, never at unreleased main.
            if [ "${repo}" = "${GHCR_IMAGE}" ] && [ -n "${VERSION_TAG}" ]; then
              tags="${tags} latest"
            fi
            for tag in ${tags}; do
              docker tag "${LOCAL_IMAGE}" "${repo}:${tag}"
              docker push "${repo}:${tag}"
            done
            echo "Published to ${repo}: ${tags}"
          done
          echo "image_tag=sha-${short_sha}" >> "$GITHUB_OUTPUT"

  # Render the chart for each stage and commit it to the private deployment repository,
  # where Argo CD syncs it. Rollback is a revert there, not a re-run here.
  #
  # tag_name is set only on the push that merged the Release PR, so dev lands at the
  # release tag then and at the commit sha otherwise.
  deploy-dev:
    needs: [release-please, publish]
    uses: ./.github/workflows/publish-manifests.yml
    with:
      stage: dev
      image_tag: ${{ needs.release-please.outputs.tag_name || needs.publish.outputs.image_tag }}
    secrets:
      aws_role_arn: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
      deploy_app_id: ${{ secrets.DEPLOY_APP_ID }}
      deploy_app_private_key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
      deploy_owner: ${{ secrets.DEPLOY_OWNER }}
      deploy_repo: ${{ secrets.DEPLOY_REPO_DEV }}
      deploy_path: ${{ secrets.DEPLOY_PATH_DEV }}
      deploy_host: ${{ secrets.DEPLOY_HOST_DEV }}
      deploy_ingress_class: ${{ secrets.DEPLOY_INGRESS_CLASS }}

  # Only a release reaches prod, and only after the `prod` Environment's reviewers
  # approve and dev has taken the same artifact.
  deploy-prod:
    needs: [release-please, deploy-dev]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/publish-manifests.yml
    with:
      stage: prod
      image_tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      aws_role_arn: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
      deploy_app_id: ${{ secrets.DEPLOY_APP_ID }}
      deploy_app_private_key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
      deploy_owner: ${{ secrets.DEPLOY_OWNER }}
      deploy_repo: ${{ secrets.DEPLOY_REPO_PROD }}
      deploy_path: ${{ secrets.DEPLOY_PATH_PROD }}
      deploy_host: ${{ secrets.DEPLOY_HOST_PROD }}
      deploy_ingress_class: ${{ secrets.DEPLOY_INGRESS_CLASS }}
